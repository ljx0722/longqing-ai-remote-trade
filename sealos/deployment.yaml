apiVersion: apps/v1
kind: Deployment
metadata:
  name: longqing-remote-trade
  labels:
    app.kubernetes.io/name: longqing-remote-trade
    app.kubernetes.io/part-of: remote-trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: longqing-remote-trade
  template:
    metadata:
      labels:
        app.kubernetes.io/name: longqing-remote-trade
        app.kubernetes.io/part-of: remote-trade
    spec:
      containers:
        - name: web
          image: ghcr.io/ljx0722/longqing-ai-remote-trade:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: longqing-remote-trade
  labels:
    app.kubernetes.io/name: longqing-remote-trade
    app.kubernetes.io/part-of: remote-trade
spec:
  selector:
    app.kubernetes.io/name: longqing-remote-trade
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
